version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Lima
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # React 19 for the browser tests, kept apart from the root React 18.
  - package-ecosystem: npm
    directory: /test/browser/react-19
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Lima
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: America/Lima
    groups:
      github-actions:
        patterns:
          - '*'
